kind = "web"
previewPath = "/"
title = "ECOMAJES"
version = "1.0.0"
id = "ecomajes-streamlit-app"

[[services]]
localPort = 5000
name = "Streamlit App"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace && /home/runner/workspace/.pythonlibs/bin/streamlit run app.py --server.port 5000"

[services.production]

[services.production.run]
args = ["bash", "-lc", "cd /home/runner/workspace && exec /home/runner/workspace/.pythonlibs/bin/streamlit run app.py --server.port 5000 --server.address 0.0.0.0 --server.headless true"]

[services.production.health.startup]
path = "/_stcore/health"
